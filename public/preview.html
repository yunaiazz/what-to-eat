<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App 图标预览</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 40px;
            font-weight: 500;
        }
        .preview-section {
            margin-bottom: 60px;
        }
        .section-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .icon-grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .icon-item {
            text-align: center;
        }
        .icon-item img {
            border-radius: 22%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin-bottom: 12px;
        }
        .icon-item .size {
            font-size: 13px;
            color: #666;
        }
        .icon-item .label {
            font-size: 14px;
            color: #999;
            margin-top: 4px;
        }
        .mockup {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .phone-mockup {
            width: 260px;
            background: #000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .phone-screen {
            background: linear-gradient(180deg, #1c1c1e 0%, #2c2c2e 100%);
            border-radius: 32px;
            padding: 50px 20px 20px;
            min-height: 460px;
            overflow: hidden;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #fff;
            margin-bottom: 25px;
            padding: 0 5px;
        }
        .app-icons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 8px;
            justify-items: center;
        }
        .app-icon {
            text-align: center;
            width: 100%;
        }
        .app-icon img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            margin-bottom: 4px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .app-icon span {
            font-size: 9px;
            color: #fff;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .placeholder-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            margin-bottom: 4px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .dock {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            background: rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 10px 15px;
        }
        .dock img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
        }
        .dock .placeholder-icon {
            width: 40px;
            height: 40px;
            margin: 0;
        }
        .download-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 40px auto 0;
            padding: 16px;
            background: #ff6f56;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
        }
        .download-btn:hover {
            background: #ff5a3d;
        }
    </style>
</head>
<body>
