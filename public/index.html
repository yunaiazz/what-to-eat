            font-weight: 600;
            border: none;

            transition: all 0.2s;

        .btn-primary:disabled {

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            margin-top: 10px;

        }

        .health-label {

            color: #558b2f;
            font-weight: 600;
            margin-bottom: 4px;

            color: #33691e;
            line-height: 1.5;

        .health-loading {

<body>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
    
    <div class="app">
        <div class="header">
            <h1>吃什么</h1>
            <p>AI 情绪饮食助手</p>
        </div>

        <div class="steps">
            <div class="step-dot active" id="step1"></div>
            <div class="step-dot" id="step2"></div>
            <div class="step-dot" id="step3"></div>
            <div class="step-dot" id="step4"></div>

        <!-- 第三页：偏好 -->
        <div class="page" id="page3">
            <div class="question-card">
                <div class="question-label">问题 3/3</div>
                <div class="question-text">还有什么想告诉我的吗？</div>

            <div class="input-card">

            <button class="btn btn-primary" onclick="startAnalysis()">开始 AI 分析</button>

            <button class="btn btn-secondary" onclick="restart()">重新开始</button>
        </div>
    </div>

            <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
        </div>
    </div>

        function init() {
            loadConfig();
        }

        function selectMood(el, mood) {
            document.querySelectorAll('#page1 .mood-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            answers.mood = mood;
            document.getElementById('nextBtn1').disabled = false;
        }

        function selectBody(el, body) {
            document.querySelectorAll('#page2 .mood-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            answers.body = body;
            document.getElementById('nextBtn2').disabled = false;
        }

        function nextPage(num) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + num).classList.add('active');
            updateSteps(num);
        }

        function prevPage(num) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + num).classList.add('active');
            updateSteps(num);
        }

        function updateSteps(current) {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById('step' + i);
                dot.classList.remove('active', 'done');
                if (i < current) dot.classList.add('done');
                if (i === current) dot.classList.add('active');
            }
        }

        async function startAnalysis() {
            answers.extra = document.getElementById('extraInput').value;
            nextPage(4);

            if (!config.apiKey) {
                setTimeout(() => useMockData(), 2000);
                return;
            }

            try {
                const response = await callDeepSeek();
                parseAIResponse(response);
                nextPage(5);
            } catch (error) {
                console.error('API Error:', error);
                useMockData();
            }
        }

        async function callDeepSeek() {
            const prompt = `你是一个情绪饮食专家。根据用户当前的状态，推荐适合的食物。

用户状态：
- 心情：${answers.mood}
- 身体状态：${answers.body}
- 补充说明：${answers.extra || '无'}

请用以下JSON格式回复（不要有其他内容）：
{
  "insight": "一句话分析用户状态和饮食建议的原因（30字以内）",
  "foods": ["食物1", "食物2", "食物3", ...]
}

要求：
1. 根据情绪科学推荐食物，比如焦虑时推荐富含镁的食物，疲惫时推荐补充能量的食物
2. foods 只填食物名称，简短（如：麻辣烫、沙拉、鸡汤）
3. 推荐10-12个不同类型的食物，涵盖中餐、西餐、小吃、饮品等`;

            // 添加超时控制
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000); // 30秒超时

            try {
                const res = await fetch(`${config.apiBase}/v1/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.7
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!res.ok) throw new Error('API request failed: ' + res.status);
                const data = await res.json();
                
                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    throw new Error('Invalid API response');
                }
                
                return data.choices[0].message.content;
            } catch (error) {
                clearTimeout(timeoutId);
                throw error;
            }
        }

        function parseAIResponse(response) {
            try {
                const jsonMatch = response.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    const data = JSON.parse(jsonMatch[0]);
                    aiInsight = data.insight || '根据你的状态，为你精选了以下美食';
                    recommendations = data.foods || [];
                }
            } catch (e) {
                console.error('Parse error:', e);
                useMockData();
                return;
            }
            renderResult();
        }

        function useMockData() {
            const mockResponses = {
                '开心': { insight: '心情好的时候适合尝试新口味，来点有仪式感的美食吧！', foods: ['火锅', '日式烧肉', '海鲜大餐', '精致西餐', '下午茶', '寿司', '烤鸭', '韩式烤肉', '意大利面', '提拉米苏', '珍珠奶茶', '法式甜点'] },
                '疲惫': { insight: '疲惫时需要补充能量，温热的食物能让你恢复元气', foods: ['鸡汤面', '牛肉粥', '参鸡汤', '热干面', '肉夹馍', '羊肉汤', '猪脚饭', '黄焖鸡', '卤肉饭', '馄饨', '豆浆油条', '红糖姜茶'] },
                '焦虑': { insight: '焦虑时推荐富含镁和B族维生素的食物，帮助放松', foods: ['深海鱼', '牛油果沙拉', '坚果酸奶', '香蕉奶昔', '菠菜面', '三文鱼', '藜麦饭', '蓝莓酸奶', '燕麦粥', '绿茶', '黑巧克力', '核桃露'] },
                '低落': { insight: '心情低落时来点comfort food，治愈系美食抚慰心灵', foods: ['芝士焗饭', '奶油意面', '红烧肉', '蛋糕甜点', '热巧克力', '炸鸡', '披萨', '冰淇淋', '布丁', '肉桂卷', '芝士蛋糕', '暖心拿铁'] },
                '平静': { insight: '平静的心情适合清淡养生，让身体也舒适起来', foods: ['日式定食', '蔬菜沙拉', '清蒸鱼', '素食简餐', '养生粥', '豆腐料理', '荞麦面', '白灼虾', '蒸蛋', '银耳汤', '水果拼盘', '花茶'] },
                '兴奋': { insight: '兴奋的时候就该吃点刺激的，让快乐加倍！', foods: ['麻辣火锅', '烧烤', '小龙虾', '冒菜', '串串香', '酸菜鱼', '毛血旺', '口水鸡', '辣子鸡', '麻辣香锅', '螺蛳粉', '冰啤酒'] }
            };
            const data = mockResponses[answers.mood] || mockResponses['平静'];
            aiInsight = data.insight;
            recommendations = data.foods;
            renderResult();
            nextPage(5);
        }

        function renderResult() {
            document.getElementById('aiInsight').textContent = aiInsight;
            const tagsContainer = document.getElementById('recTags');
            tagsContainer.innerHTML = recommendations.map(f => 
                `<div class="rec-tag"><span class="tag-emoji">${getEmoji(f)}</span><span class="tag-name">${f}</span></div>`
            ).join('');
        }

        function getEmoji(food) {
            for (const item of emojiKeywords) {
                for (const keyword of item.keywords) {
                    if (food.includes(keyword) || keyword.includes(food)) {
                        return item.emoji;
                    }
                }
            }
            return '🍽️';
        }

        function spinSlot() {
            if (isSpinning || recommendations.length === 0) return;
            
            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const slotItems = document.getElementById('slotItems');
            const tags = document.querySelectorAll('.rec-tag');
            
            btn.disabled = true;
            btn.textContent = '抽取中...';
            tags.forEach(t => t.classList.remove('highlight'));

            const resultIndex = Math.floor(Math.random() * recommendations.length);
            const result = recommendations[resultIndex];
            
            const spins = 25;
            let items = [];
            for (let i = 0; i < spins; i++) {
                const food = recommendations[i % recommendations.length];
                items.push(`<div class="slot-item" style="height:56px"><span class="slot-emoji">${getEmoji(food)}</span><span class="slot-text">${food}</span></div>`);
            }
            items.push(`<div class="slot-item" style="height:56px"><span class="slot-emoji">${getEmoji(result)}</span><span class="slot-text">${result}</span></div>`);
            
            slotItems.innerHTML = items.join('');
            slotItems.style.transition = 'none';
            slotItems.style.transform = 'translateY(0)';
            
            requestAnimationFrame(() => {
                slotItems.style.transition = 'transform 3s cubic-bezier(0.15, 0.85, 0.3, 1)';
                slotItems.style.transform = `translateY(-${spins * 56}px)`;
            });
            
            setTimeout(() => {
                showConfetti();
                // 安全检查：确保 tags 存在且索引有效
                if (tags && tags.length > resultIndex) {
                    tags[resultIndex].classList.add('highlight');
                }
                btn.disabled = false;
                btn.textContent = '再抽一次';
                isSpinning = false;
            }, 3000);
        }

        function restart() {
            answers = { mood: '', body: '', extra: '' };
            recommendations = [];
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('extraInput').value = '';
            document.getElementById('nextBtn1').disabled = true;
            document.getElementById('nextBtn2').disabled = true;
            nextPage(1);
            updateSteps(1);
        }

        function openSettings() {
            document.getElementById('apiKeyInput').value = config.apiKey;
            document.getElementById('apiBaseInput').value = config.apiBase;
            document.getElementById('settingsModal').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        function saveSettings() {
            config.apiKey = document.getElementById('apiKeyInput').value.trim();
            config.apiBase = document.getElementById('apiBaseInput').value.trim() || 'https://api.deepseek.com';
            localStorage.setItem('chishenme-config', JSON.stringify(config));
            closeSettings();
        }

        function loadConfig() {
            const saved = localStorage.getItem('chishenme-config');
            if (saved) {
                const savedConfig = JSON.parse(saved);
                // 合并配置，保留默认 API Key
                config.apiKey = savedConfig.apiKey || config.apiKey;
                config.apiBase = savedConfig.apiBase || config.apiBase;
            }
        }

        function showConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#ff6f56', '#ff9a56', '#ffd56b', '#56c8ff', '#56ff9a'];
            for (let i = 0; i < 40; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = Math.random() * 0.5 + 's';
                container.appendChild(piece);
                setTimeout(() => piece.remove(), 4000);
            }
        }

        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) closeSettings();
        });

        init();
    </script>
